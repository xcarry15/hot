name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:../db/ci.db
      API_TOKEN: ci-only-token
      NEXT_PUBLIC_SITE_URL: https://hot.kfxz.cn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8 --no-audit --no-fund
      - run: bash scripts/install-dependencies.sh
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      # 单 worker 串行：多个测试共享 CI 的 SQLite 文件，并发会触发同名 trigger 竞态
      # （reject_publication_update already exists）。与 migration smoke 的 --maxWorkers=1 一致。
      - run: npm test -- --maxWorkers=1

  migrations:
    name: Migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:../db/ci-migrations.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8 --no-audit --no-fund
      - run: bash scripts/install-dependencies.sh
      - run: npm run db:generate
      - run: npm run test:migrations

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:../db/ci-build.db
      API_TOKEN: ci-only-token
      SETTINGS_ENCRYPTION_KEY: ci-only-settings-encryption-key-for-e2e
      NEXT_PUBLIC_SITE_URL: https://hot.kfxz.cn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8 --no-audit --no-fund
      - run: bash scripts/install-dependencies.sh
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy production
    needs: [quality, migrations, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
