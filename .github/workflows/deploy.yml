name: Deploy production

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      reset_production:
        description: "仅在已明确授权时重置生产 SQLite（删除现有业务数据且不备份）"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://hot.kfxz.cn
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS || secrets.DEPLOY_KNOWN_HOSTS }}
      APP_NAME: hot
      APP_DIR: /www/wwwroot/hot.kfxz.cn
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

      - name: Checkout verified revision
        uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ARCHIVE_NAME="h2-hot2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          printf '%s\n' "$GITHUB_SHA" > .release-revision
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.next \
            --exclude=node_modules \
            --exclude=coverage \
            --exclude=db \
            --exclude=bat \
            --exclude=docs \
            --exclude=.agents \
            --exclude=.codex \
            --exclude=AGENTS.md \
            --exclude=README.md \
            --exclude=tests \
            --exclude='*.log' \
            --exclude='.env*' \
            -czf "/tmp/$RELEASE_ARCHIVE_NAME" .

      - name: Upload and activate release
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          RESET_PRODUCTION="${{ github.event_name == 'workflow_dispatch' && inputs.reset_production || 'no' }}"
          RELEASE_ARCHIVE_NAME="h2-hot2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          SSH_OPTS=(
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -o ConnectTimeout=30
          )
          scp "${SSH_OPTS[@]}" -P "$DEPLOY_PORT" "/tmp/$RELEASE_ARCHIVE_NAME" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/$RELEASE_ARCHIVE_NAME"
          ssh "${SSH_OPTS[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' RELEASE_ARCHIVE='/tmp/$RELEASE_ARCHIVE_NAME' RESET_PRODUCTION='$RESET_PRODUCTION' bash -s" \
            < scripts/deploy-production.sh

      - name: Verify deployed revision
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 https://hot.kfxz.cn/api/health)"
          DEPLOYED_REVISION="$(node -e 'const fs = require("node:fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(typeof body.revision === "string" ? body.revision : "")' <<<"$HEALTH_RESPONSE")"
          test "$DEPLOYED_REVISION" = "$GITHUB_SHA" || {
            echo "Expected revision $GITHUB_SHA, got ${DEPLOYED_REVISION:-missing}" >&2
            exit 1
          }
