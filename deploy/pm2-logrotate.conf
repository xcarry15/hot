# PM2 日志轮转配置（1-hot / hot 单实例）
#
# 背景：生产 /root/.pm2/modules/ 为空，未安装 pm2-logrotate 模块；
#       out.log 已达 39.5 MB / 384007 行、error.log 9111 行，磁盘已用 65%+。
#
# 安装（在【生产机】上由运维人工执行；本仓库不自动安装、不连生产机）：
#   sudo cp deploy/pm2-logrotate.conf /etc/logrotate.d/pm2-hot
#   sudo chmod 0644 /etc/logrotate.d/pm2-hot
#   sudo logrotate -d /etc/logrotate.d/pm2-hot      # 预演：只打印将要做的动作，不改动日志
#   sudo logrotate -f /etc/logrotate.d/pm2-hot      # 确认预演无误后，首次强制执行一次
#   之后由系统 cron.daily/logrotate 或 systemd logrotate.timer 按 daily 自动触发。
#
# 关键说明：
#   - copytruncate 是必需的：PM2/next-server 进程长期持有日志文件 fd 且不会重新打开，
#     用默认的 create（rename + 新建）会让进程继续写已被改名的旧文件，日志反而丢失。
#     copytruncate 原地复制后截断，进程 fd 继续指向同一 inode。
#   - logrotate 配置里不展开 ~，因此这里写绝对路径；若 PM2 以非 root 用户运行，
#     把下方路径改为该用户家目录下的 .pm2/logs/*.log（绝对路径）。
#   - daily + rotate 14 + compress + delaycompress：每天一份，保留 14 份，历史压缩。
#   - 也可改用 PM2 自带模块 `pm2 install pm2-logrotate`；与本配置二选一，不要同时启用，
#     否则同一日志可能被两条规则重复轮转。
#   - 轮转只影响日志文件，不影响数据库、不需要停 PM2、不需要 reload Nginx。

/root/.pm2/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    su root root
}
